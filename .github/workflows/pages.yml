# Site/ をそのまま GitHub Pages へ出す（ビルドは無い）。
# 公開するのは master に入ったときだけ（dev の途中の状態を出さない）。
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "Site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Site
      - id: deployment
        uses: actions/deploy-pages@v4
